<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かな帖 — 가나 & 여행 일본어</title>
<style>
  :root{
    --washi:#FAF6F0;
    --washi-deep:#F1EADC;
    --sumi:#1C1C1E;
    --sumi-soft:#4A4540;
    --inkan:#B33A3A;
    --inkan-deep:#8E2C2C;
    --kin:#C9962F;
    --kin-bg:#FBF1DD;
    --ao:#2E6E7E;
    --ao-bg:#E3EFF1;
    --ai:#3B5A82;
    --ai-bg:#E7EDF5;
    --hai:#8B8378;
    --line:#DDD3C1;
    --midori:#3F7D4A;
    --midori-bg:#E8F3EA;
    --keikoku:#B85C1E;
    --keikoku-bg:#FBEADD;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--washi);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(180,160,130,0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(180,160,130,0.08) 0%, transparent 45%);
    color:var(--sumi);
    font-family:"Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    overflow-x:hidden;
  }

  header{ width:100%; max-width:560px; text-align:center; margin-bottom:18px; }
  .title-row{ display:flex; align-items:baseline; justify-content:center; gap:10px; }
  .title-jp{
    font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:2.0rem; font-weight:700; letter-spacing:0.04em; color:var(--sumi);
  }
  .title-stamp{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border:2px solid var(--inkan); border-radius:4px;
    color:var(--inkan); font-size:0.72rem; font-weight:700; transform:rotate(-6deg); flex-shrink:0;
  }
  .subtitle{ margin-top:6px; font-size:0.82rem; color:var(--hai); letter-spacing:0.03em; }

  .control-bar{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .group-label{ font-size:0.72rem; color:var(--hai); font-weight:700; letter-spacing:0.04em; margin-bottom:2px; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .chip{
    border:1px solid var(--line); background:#fff; color:var(--sumi-soft);
    font-size:0.76rem; padding:6px 12px; border-radius:100px; cursor:pointer;
    transition:all 0.18s ease; font-weight:500; white-space:nowrap;
  }
  .chip:hover{ border-color:var(--ao); }
  .chip.active{ background:var(--sumi); color:var(--washi); border-color:var(--sumi); }
  .chip.active.cat-hiragana{ background:var(--kin); border-color:var(--kin); color:#fff; }
  .chip.active.cat-katakana{ background:var(--ao); border-color:var(--ao); color:#fff; }
  .chip.active.cat-number{ background:#8a6d1f; border-color:#8a6d1f; color:#fff; }
  .chip.active.cat-vocab{ background:var(--ai); border-color:var(--ai); color:#fff; }
  .chip.active.cat-greeting{ background:var(--inkan); border-color:var(--inkan); color:#fff; }
  .chip.active.cat-daily{ background:var(--midori); border-color:var(--midori); color:#fff; }
  .chip.active.cat-travel{ background:var(--ai); border-color:var(--ai); color:#fff; }
  .chip.active.cat-emergency{ background:var(--keikoku); border-color:var(--keikoku); color:#fff; }

  .mode-row{ display:flex; justify-content:center; gap:8px; }
  .mode-btn{
    flex:1; max-width:160px; padding:9px 14px; border-radius:8px; border:1px solid var(--line);
    background:#fff; font-size:0.82rem; font-weight:600; color:var(--sumi-soft); cursor:pointer;
    text-align:center; transition:all 0.18s ease;
  }
  .mode-btn.active{ background:var(--sumi); color:var(--washi); border-color:var(--sumi); }

  .progress-strip{ width:100%; max-width:560px; margin-bottom:14px; }
  .progress-track{ height:5px; border-radius:100px; background:var(--line); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--ao), var(--kin)); border-radius:100px; transition:width 0.3s ease; }
  .progress-label{ display:flex; justify-content:space-between; margin-top:6px; font-size:0.74rem; color:var(--hai); font-weight:600; }
  .progress-label .stats{ display:flex; gap:10px; }
  .stat-correct{ color:var(--ao); }
  .stat-wrong{ color:var(--inkan); }

  .stage{ width:100%; max-width:560px; perspective:1600px; margin-bottom:22px; }
  .card-wrap{ position:relative; height:340px; }
  .card{
    position:absolute; inset:0; border-radius:18px; cursor:pointer;
    transform-style:preserve-3d; transition:transform 0.5s cubic-bezier(0.4,0.0,0.2,1);
    box-shadow:0 1px 3px rgba(28,28,30,0.06), 0 10px 30px -10px rgba(28,28,30,0.18);
  }
  .card.flipped{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0; border-radius:18px; backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 28px; background:#fff;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(28,28,30,0.012) 39px),
      repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(28,28,30,0.012) 39px);
    border:1px solid var(--line); text-align:center;
  }
  .card-face.back{ transform:rotateY(180deg); }

  .card-tag{
    position:absolute; top:18px; left:20px; font-size:0.68rem; font-weight:700;
    letter-spacing:0.04em; color:var(--hai); background:var(--washi-deep); padding:4px 10px; border-radius:100px;
  }
  .card-tag.hiragana{ color:var(--kin); background:var(--kin-bg); }
  .card-tag.katakana{ color:var(--ao); background:var(--ao-bg); }
  .card-tag.number{ color:#8a6d1f; background:var(--kin-bg); }
  .card-tag.vocab{ color:var(--ai); background:var(--ai-bg); }
  .card-tag.greeting{ color:var(--inkan-deep); background:#F7E8E5; }
  .card-tag.daily{ color:var(--midori); background:var(--midori-bg); }
  .card-tag.travel{ color:var(--ai); background:var(--ai-bg); }
  .card-tag.emergency{ color:var(--keikoku); background:var(--keikoku-bg); }

  .card-counter{ position:absolute; top:18px; right:20px; font-size:0.74rem; color:var(--hai); font-weight:600; }

  .card-jp{
    font-family:"Noto Serif JP","Hiragino Mincho ProN",serif; font-size:3.4rem; font-weight:700;
    color:var(--sumi); line-height:1.25; word-break:keep-all;
  }
  .card-jp.compact{ font-size:1.8rem; }
  .card-jp.kana-glyph{ font-size:4.6rem; }
  .card-reading{ margin-top:10px; font-size:1rem; color:var(--hai); letter-spacing:0.03em; }
  .card-hint{ margin-top:22px; font-size:0.76rem; color:var(--hai); display:flex; align-items:center; gap:6px; }
  .card-hint svg{ width:13px; height:13px; opacity:0.7; }

  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    margin-top:14px; padding:7px 16px; border-radius:100px; border:1px solid var(--line);
    background:#fff; color:var(--ao); font-size:0.78rem; font-weight:700; cursor:pointer;
    transition:all 0.15s ease;
  }
  .speak-btn:hover{ background:var(--ao-bg); border-color:var(--ao); }
  .speak-btn:active{ transform:scale(0.96); }
  .speak-btn svg{ width:14px; height:14px; }
  .speak-btn.small{ margin-top:8px; padding:5px 12px; font-size:0.72rem; }

  .card-kr{ font-size:1.55rem; font-weight:700; }
  .card-reading-back{ margin-top:4px; font-size:0.86rem; color:var(--hai); }
  .card-note{ margin-top:10px; font-size:0.82rem; color:var(--sumi-soft); background:var(--washi-deep); padding:6px 12px; border-radius:8px; }
  .card-example{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); width:100%; }
  .card-example-jp{ font-family:"Noto Serif JP",serif; font-size:1.05rem; color:var(--sumi); }
  .card-example-kr{ margin-top:5px; font-size:0.82rem; color:var(--hai); }

  .stamp-mark{
    position:absolute; top:14px; right:16px; width:54px; height:54px; border:3px solid var(--inkan);
    border-radius:8px; color:var(--inkan); display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif JP",serif; font-size:0.95rem; font-weight:900; transform:rotate(-12deg) scale(0);
    opacity:0; pointer-events:none; z-index:5;
  }
  .stamp-mark.correct{ animation:stampIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .stamp-mark.wrong{ border-color:var(--hai); color:var(--hai); animation:stampIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  @keyframes stampIn{
    0%{ transform:rotate(-12deg) scale(2); opacity:0; }
    60%{ transform:rotate(-12deg) scale(0.92); opacity:1; }
    100%{ transform:rotate(-12deg) scale(1); opacity:1; }
  }

  .nav-row{ display:flex; gap:10px; margin-top:16px; }
  .nav-btn{
    flex:1; padding:13px; border-radius:10px; border:none; font-size:0.92rem; font-weight:700;
    cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .nav-btn:active{ transform:scale(0.97); }
  .nav-btn.know{ background:var(--ao); color:#fff; }
  .nav-btn.know:hover{ background:#255a67; }
  .nav-btn.dontknow{ background:#fff; color:var(--inkan-deep); border:1.5px solid var(--inkan); }
  .nav-btn.dontknow:hover{ background:#FDF3F2; }
  .nav-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .seek-row{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .seek-btn{ background:none; border:none; color:var(--hai); font-size:0.85rem; cursor:pointer; padding:6px 10px; display:flex; align-items:center; gap:4px; }
  .seek-btn:hover{ color:var(--sumi); }
  .seek-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .shuffle-btn{
    background:none; border:1px solid var(--line); border-radius:100px; padding:6px 14px;
    font-size:0.78rem; color:var(--sumi-soft); cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .shuffle-btn:hover{ border-color:var(--ao); color:var(--ao); }

  .quiz-panel{ width:100%; max-width:560px; }
  .quiz-question{
    background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px 26px; text-align:center;
    margin-bottom:18px; box-shadow:0 1px 3px rgba(28,28,30,0.06), 0 10px 30px -10px rgba(28,28,30,0.18);
  }
  .quiz-mode-label{ font-size:0.76rem; color:var(--hai); font-weight:700; margin-bottom:12px; letter-spacing:0.02em; }
  .quiz-input-wrap{ display:flex; gap:8px; margin-top:4px; }
  #quizInput{
    flex:1; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:1rem; font-family:inherit; background:#fff; color:var(--sumi);
  }
  #quizInput:focus{ outline:none; border-color:var(--ao); }
  #quizInput.correct{ border-color:var(--ao); background:var(--ao-bg); }
  #quizInput.wrong{ border-color:var(--inkan); background:#FDF1F0; animation:shakeInput 0.25s; }
  @keyframes shakeInput{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .quiz-submit{
    padding:0 22px; border-radius:10px; border:none; background:var(--sumi); color:var(--washi);
    font-size:0.9rem; font-weight:700; cursor:pointer;
  }
  .quiz-submit:hover{ background:#000; }
  .quiz-feedback{ margin-top:14px; font-size:0.86rem; font-weight:600; min-height:20px; text-align:center; }
  .quiz-feedback.correct{ color:var(--ao); }
  .quiz-feedback.wrong{ color:var(--inkan-deep); }
  .quiz-feedback.hint{ color:var(--kin); }
  .quiz-actions-row{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; }
  .hint-btn{
    background:none; border:1px solid var(--line); border-radius:100px; padding:8px 16px;
    font-size:0.78rem; color:var(--sumi-soft); cursor:pointer; white-space:nowrap;
  }
  .hint-btn:hover{ border-color:var(--kin); color:var(--kin); }

  .quiz-next{
    flex:1; padding:13px; border-radius:10px; border:none; background:var(--sumi);
    color:var(--washi); font-size:0.9rem; font-weight:700; cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .quiz-next.show{ opacity:1; pointer-events:auto; }

  .complete-screen{
    width:100%; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:48px 32px; text-align:center; box-shadow:0 1px 3px rgba(28,28,30,0.06), 0 10px 30px -10px rgba(28,28,30,0.18);
  }
  .complete-stamp{
    font-family:"Noto Serif JP",serif; font-size:1.4rem; font-weight:900; color:var(--inkan);
    border:3px solid var(--inkan); border-radius:8px; display:inline-block; padding:10px 22px;
    transform:rotate(-4deg); margin-bottom:18px;
  }
  .complete-score{ font-size:2.2rem; font-weight:800; color:var(--sumi); margin-bottom:6px; }
  .complete-desc{ font-size:0.88rem; color:var(--hai); margin-bottom:24px; }
  .complete-actions{ display:flex; gap:10px; justify-content:center; }
  .complete-btn{ padding:12px 22px; border-radius:10px; font-size:0.88rem; font-weight:700; cursor:pointer; border:none; }
  .complete-btn.primary{ background:var(--ao); color:#fff; }
  .complete-btn.secondary{ background:#fff; border:1px solid var(--line); color:var(--sumi-soft); }

  .wrong-list{ margin-top:22px; text-align:left; border-top:1px dashed var(--line); padding-top:18px; }
  .wrong-list-title{ font-size:0.78rem; font-weight:700; color:var(--hai); margin-bottom:10px; letter-spacing:0.03em; }
  .wrong-item{ display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--washi-deep); font-size:0.88rem; }
  .wrong-item .jp{ font-family:"Noto Serif JP",serif; font-weight:700; color:var(--sumi); }
  .wrong-item .kr{ color:var(--hai); }

  footer{ margin-top:26px; font-size:0.72rem; color:var(--hai); text-align:center; }

  @media (max-width:420px){
    .title-jp{ font-size:1.6rem; }
    .card-wrap{ height:320px; }
    .card-jp{ font-size:2.6rem; }
    .card-jp.compact{ font-size:1.5rem; }
    .card-jp.kana-glyph{ font-size:3.8rem; }
    .quiz-input-wrap{ flex-direction:column; }
    .quiz-submit{ padding:12px; }
  }
  @media (prefers-reduced-motion: reduce){
    .card, .stamp-mark{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <span class="title-jp">かな帖</span>
    <span class="title-stamp">旅</span>
  </div>
  <div class="subtitle">히라가나 · 카타카나 · 숫자/시간/돈 · 인사·가족·일상 · 여행회화 · 긴급상황 (한자 없음)</div>
</header>

<div class="control-bar">
  <div class="chip-row" id="categoryChips"></div>
  <div class="mode-row">
    <button class="mode-btn active" data-mode="flip" id="modeFlip">카드 뒤집기</button>
    <button class="mode-btn" data-mode="quiz" id="modeQuiz">직접입력 테스트</button>
  </div>
</div>

<div class="progress-strip">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label">
    <span id="progressCount">0 / 0</span>
    <span class="stats">
      <span class="stat-correct" id="statCorrect">✓ 0</span>
      <span class="stat-wrong" id="statWrong">✗ 0</span>
    </span>
  </div>
</div>

<div class="stage" id="flipStage">
  <div class="card-wrap" id="cardWrap">
    <div class="card" id="card">
      <div class="card-face front" id="cardFront">
        <span class="card-tag" id="tagFront">히라가나</span>
        <span class="card-counter" id="counterFront">1 / 437</span>
        <div class="card-jp" id="jpFront">あ</div>
        <div class="card-reading" id="readingFront"></div>
        <button class="speak-btn" id="speakFrontBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          발음 듣기
        </button>
        <div class="card-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-9-9c2.5 0 4.7 1 6.3 2.7"/><path d="M21 3v6h-6"/></svg>
          탭하여 발음·뜻 보기
        </div>
      </div>
      <div class="card-face back" id="cardBack">
        <div class="stamp-mark" id="stampMark">合</div>
        <span class="card-tag" id="tagBack">히라가나</span>
        <span class="card-counter" id="counterBack">1 / 437</span>
        <div class="card-kr" id="krBack">아 (a)</div>
        <div class="card-reading-back" id="readingBack" style="display:none;"></div>
        <button class="speak-btn small" id="speakBackBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          발음 듣기
        </button>
        <div class="card-note" id="noteBack" style="display:none;"></div>
        <div class="card-example" id="exampleBlock" style="display:none;">
          <div class="card-example-jp" id="exampleJp"></div>
          <div class="card-example-kr" id="exampleKr"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn dontknow" id="btnDontKnow">✗ 아직 모름</button>
    <button class="nav-btn know" id="btnKnow">✓ 외웠음</button>
  </div>
  <div class="seek-row">
    <button class="seek-btn" id="btnPrev">← 이전</button>
    <button class="shuffle-btn" id="btnShuffle">⤨ 섞기</button>
    <button class="seek-btn" id="btnNext">다음 →</button>
  </div>
</div>

<div class="quiz-panel" id="quizStage" style="display:none;">
  <div class="quiz-question">
    <span class="card-tag" id="quizTag" style="position:static; display:inline-block; margin-bottom:10px;">히라가나</span>
    <div class="quiz-mode-label" id="quizModeLabel">문장(단어)을 일본어로 입력하세요</div>
    <div class="card-jp" id="quizPrompt" style="font-size:2.2rem;">あ</div>
    <div class="card-reading" id="quizSubPrompt"></div>
    <button class="speak-btn small" id="speakQuizBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
      발음 듣기
    </button>
    <div class="quiz-input-wrap">
      <input type="text" id="quizInput" placeholder="가나 또는 로마자로 입력" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="quiz-submit" id="quizSubmitBtn" type="button">확인</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
  </div>
  <div class="quiz-actions-row">
    <button class="hint-btn" id="quizHintBtn" data-stage="0" type="button">힌트 보기</button>
    <button class="quiz-next" id="quizNextBtn" type="button">다음 문제 →</button>
  </div>
</div>

<div class="complete-screen" id="completeScreen" style="display:none;">
  <div class="complete-stamp">修了</div>
  <div class="complete-score" id="completeScore">0 / 0</div>
  <div class="complete-desc" id="completeDesc">이번 세트를 모두 확인했어요</div>
  <div class="complete-actions">
    <button class="complete-btn secondary" id="btnRestartAll">처음부터</button>
    <button class="complete-btn primary" id="btnRetryWrong">헷갈린 것만 다시</button>
  </div>
  <div class="wrong-list" id="wrongListWrap" style="display:none;">
    <div class="wrong-list-title">다시 볼 카드</div>
    <div id="wrongListItems"></div>
  </div>
</div>

<footer>
  카드뒤집기: 탭으로 앞뒤 확인 · 직접입력 테스트: 정답을 맞혀야 다음으로 진행 · 진도는 이 브라우저에 자동 저장됩니다
  <br>
  <button id="btnResetProgress" style="margin-top:8px; background:none; border:none; color:var(--hai); font-size:0.72rem; text-decoration:underline; cursor:pointer;">전체 학습 진도 초기화</button>

const CATEGORY_COLOR = { hiragana:'var(--kin)', katakana:'var(--ao)', number:'#8a6d1f', vocab:'var(--ai)', greeting:'var(--inkan-deep)', daily:'var(--midori)', travel:'var(--ai)', emergency:'var(--keikoku)' };
const PROGRESS_KEY = 'kanaTravelProgress_v2';

function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(results)); } catch(e){ /* storage unavailable */ }
}
function resetAllProgress(){
  if(!confirm('전체 학습 진도와 정답 기록을 초기화할까요? 되돌릴 수 없어요.')) return;
  results = {};
  try{ localStorage.removeItem(PROGRESS_KEY); } catch(e){}
  buildDeck();
}

let activeSub = null;
let mode = 'flip';
let deck = [];
let idx = 0;
let isFlipped = false;
let results = loadProgress();
let quizPool = [];
let quizIdx = 0;
let quizAttempts = 0;
let quizMistakeIds = new Set();

function buildSubList(){
  const subs = {};
  const order = [];
  DECK.forEach(c=>{
    const key = c.category+'::'+c.sub;
    if(!subs[key]){ subs[key] = {category:c.category, sub:c.sub, count:0}; order.push(key); }
    subs[key].count++;
  });
  return order.map(k=>subs[k]);
}

function renderChips(){
  const wrap = document.getElementById('categoryChips');
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip active';
  allChip.textContent = '전체 (' + DECK.length + ')';
  allChip.onclick = ()=>{ setFilter(null); highlightChip(allChip); };
  wrap.appendChild(allChip);

  const subs = buildSubList();
  subs.forEach(s=>{
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = s.sub + ' (' + s.count + ')';
    chip.dataset.cat = s.category;
    chip.onclick = ()=>{ setFilter(s); highlightChip(chip); };
    wrap.appendChild(chip);
  });

  function highlightChip(target){
    [...wrap.children].forEach(c=>{ c.classList.remove('active','cat-hiragana','cat-katakana','cat-number','cat-vocab','cat-greeting','cat-daily','cat-travel','cat-emergency'); });
    target.classList.add('active');
    if(target.dataset.cat) target.classList.add('cat-'+target.dataset.cat);
  }
}

function setFilter(subFilter){
  activeSub = subFilter;
  buildDeck();
}

function buildDeck(){
  if(activeSub){
    deck = DECK.filter(c=>c.category===activeSub.category && c.sub===activeSub.sub);
  } else {
    deck = [...DECK];
  }
  idx = 0; isFlipped = false;
  document.getElementById('completeScreen').style.display='none';
  if(mode==='flip'){
    document.getElementById('flipStage').style.display='block';
    document.getElementById('quizStage').style.display='none';
    renderCard();
  } else {
    document.getElementById('flipStage').style.display='none';
    document.getElementById('quizStage').style.display='block';
    buildQuizPool();
    renderQuiz();
  }
  updateProgress();
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function shuffleDeck(){
  shuffleArr(deck);
  idx = 0; isFlipped = false; renderCard();
}

function isKanaCategory(cat){ return cat==='hiragana' || cat==='katakana'; }

function renderCard(){
  if(deck.length===0) return;
  if(idx>=deck.length){ showComplete(); return; }
  const c = deck[idx];
  const card = document.getElementById('card');
  card.classList.remove('flipped');
  isFlipped = false;
  document.getElementById('stampMark').className = 'stamp-mark';

  const tagF = document.getElementById('tagFront');
  const tagB = document.getElementById('tagBack');
  tagF.textContent = c.sub;
  tagB.textContent = c.sub;
  tagF.className = 'card-tag ' + c.category;
  tagB.className = 'card-tag ' + c.category;

  document.getElementById('counterFront').textContent = (idx+1)+' / '+deck.length;
  document.getElementById('counterBack').textContent = (idx+1)+' / '+deck.length;

  const jpEl = document.getElementById('jpFront');
  jpEl.textContent = c.jp;
  jpEl.className = 'card-jp';
  if(isKanaCategory(c.category)) jpEl.classList.add('kana-glyph');
  else if(c.jp.length>6) jpEl.classList.add('compact');

  const readingFront = document.getElementById('readingFront');
  if(isKanaCategory(c.category)){
    readingFront.style.display='none';
  } else {
    readingFront.style.display='block';
    readingFront.textContent = c.reading || '';
  }

  document.getElementById('krBack').textContent = c.kr;
  document.getElementById('krBack').style.color = CATEGORY_COLOR[c.category] || 'var(--sumi)';

  const readingBack = document.getElementById('readingBack');
  if(isKanaCategory(c.category) && c.reading){
    readingBack.style.display='block';
    readingBack.textContent = c.reading;
  } else {
    readingBack.style.display='none';
  }

  const noteEl = document.getElementById('noteBack');
  if(c.note){ noteEl.style.display='inline-block'; noteEl.textContent = c.note; }
  else { noteEl.style.display='none'; }

  const exBlock = document.getElementById('exampleBlock');
  if(c.example){
    exBlock.style.display='block';
    document.getElementById('exampleJp').textContent = c.example;
    document.getElementById('exampleKr').textContent = c.exampleKr || '';
  } else {
    exBlock.style.display='none';
  }

  document.getElementById('btnKnow').disabled=false;
  document.getElementById('btnDontKnow').disabled=false;
  document.getElementById('btnPrev').disabled = idx===0;
}

function flipCard(){
  if(deck.length===0 || idx>=deck.length) return;
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
}

function markAndAdvance(known){
  if(deck.length===0 || idx>=deck.length) return;
  const c = deck[idx];
  results[c.id] = known ? 'correct' : 'wrong';
  saveProgress();
  if(!isFlipped){ isFlipped = true; document.getElementById('card').classList.add('flipped'); }
  const stamp = document.getElementById('stampMark');
  stamp.textContent = known ? '合' : '否';
  stamp.className = 'stamp-mark ' + (known ? 'correct':'wrong');
  updateProgress();
  setTimeout(()=>{ idx++; renderCard(); }, known ? 420 : 520);
}

function goPrev(){ if(idx>0){ idx--; renderCard(); } }
function goNext(){ if(idx<deck.length-1){ idx++; renderCard(); } else if(idx===deck.length-1){ idx++; showComplete(); } }

function updateProgress(){
  const total = deck.length;
  const ids = new Set(deck.map(c=>String(c.id)));
  const done = Object.keys(results).filter(id=>ids.has(String(id))).length;
  const correct = Object.entries(results).filter(([id,r])=>ids.has(String(id)) && r==='correct').length;
  const wrong = Object.entries(results).filter(([id,r])=>ids.has(String(id)) && r==='wrong').length;
  document.getElementById('progressFill').style.width = total? (done/total*100)+'%' : '0%';
  document.getElementById('progressCount').textContent = done + ' / ' + total;
  document.getElementById('statCorrect').textContent = '✓ ' + correct;
  document.getElementById('statWrong').textContent = '✗ ' + wrong;
}

function showComplete(){
  document.getElementById('flipStage').style.display='none';
  document.getElementById('quizStage').style.display='none';
  const screen = document.getElementById('completeScreen');
  screen.style.display='block';

  let wrongIds, correctCount, totalCount, descText;
  if(mode==='quiz'){
    totalCount = deck.length;
    wrongIds = [...quizMistakeIds].map(String);
    correctCount = totalCount - wrongIds.length;
    descText = '한 번에 맞춘 문제 수 (전체 ' + totalCount + '문제를 모두 통과했어요)';
  } else {
    totalCount = deck.length;
    const ids = new Set(deck.map(c=>String(c.id)));
    wrongIds = Object.keys(results).filter(id=>ids.has(id) && results[id]==='wrong');
    correctCount = Object.entries(results).filter(([id,r])=>ids.has(id) && r==='correct').length;
    descText = '외운 카드 · 이번 세트를 모두 확인했어요';
  }
  document.getElementById('completeScore').textContent = correctCount + ' / ' + totalCount;
  document.getElementById('completeDesc').textContent = descText;

  const wrongWrap = document.getElementById('wrongListWrap');
  const wrongItemsEl = document.getElementById('wrongListItems');
  if(wrongIds.length>0){
    wrongWrap.style.display='block';
    wrongItemsEl.innerHTML='';
    wrongIds.forEach(wid=>{
      const card = DECK.find(c=>String(c.id)===String(wid));
      if(!card) return;
      const row = document.createElement('div');
      row.className='wrong-item';
      row.innerHTML = '<span class="jp"></span><span class="kr"></span>';
      row.querySelector('.jp').textContent = card.jp;
      row.querySelector('.kr').textContent = card.kr;
      wrongItemsEl.appendChild(row);
    });
    document.getElementById('btnRetryWrong').style.display='inline-block';
  } else {
    wrongWrap.style.display='none';
    document.getElementById('btnRetryWrong').style.display='none';
  }
}

function buildQuizPool(){
  quizPool = shuffleArr([...deck]);
  quizIdx = 0;
  quizMistakeIds = new Set();
}

function normalizeAnswer(s){
  return (s||'').toString().trim().toLowerCase()
    .normalize('NFKC')
    .replace(/[\s　]/g,'')
    .replace(/[!！?？。.,、~〜ー\-]/g,'');
}

function getAcceptedAnswers(c){
  const list = [c.jp];
  if(c.reading) list.push(c.reading);
  return list.map(normalizeAnswer);
}

function renderQuiz(){
  document.getElementById('flipStage').style.display='none';
  document.getElementById('quizStage').style.display='block';
  document.getElementById('completeScreen').style.display='none';
  if(quizPool.length===0) return;
  if(quizIdx>=quizPool.length){ showComplete(); return; }

  quizAttempts = 0;
  const c = quizPool[quizIdx];
  const tag = document.getElementById('quizTag');
  tag.textContent = c.sub;
  tag.className = 'card-tag ' + c.category;
  tag.style.position='static'; tag.style.display='inline-block';

  const isBlank = !!c.example;
  document.getElementById('quizModeLabel').textContent = isBlank ? '빈칸에 들어갈 말을 일본어로 입력하세요' : '아래 뜻을 일본어로 입력하세요';

  const promptEl = document.getElementById('quizPrompt');
  const subEl = document.getElementById('quizSubPrompt');
  if(isBlank){
    promptEl.textContent = c.example.split(c.jp).join('＿＿＿');
    promptEl.style.fontSize = c.example.length>14 ? '1.4rem':'1.9rem';
    subEl.textContent = (c.exampleKr||'') + (c.kr ? '  [' + c.kr + ']' : '');
  } else {
    promptEl.textContent = c.kr;
    promptEl.style.fontSize = isKanaCategory(c.category) ? '3rem' : (c.kr.length>10 ? '1.5rem':'2.1rem');
    subEl.textContent = '';
  }

  const input = document.getElementById('quizInput');
  input.value=''; input.disabled=false; input.className='';
  const feedback = document.getElementById('quizFeedback');
  feedback.textContent=''; feedback.className='quiz-feedback';
  document.getElementById('quizNextBtn').classList.remove('show');
  const hintBtn = document.getElementById('quizHintBtn');
  hintBtn.textContent='힌트 보기'; hintBtn.dataset.stage='0'; hintBtn.style.display='inline-block';
  input.focus();
  updateProgress();
}

function submitQuizAnswer(){
  const input = document.getElementById('quizInput');
  if(input.disabled) return;
  const userVal = normalizeAnswer(input.value);
  if(!userVal) return;
  const c = quizPool[quizIdx];
  const accepted = getAcceptedAnswers(c);
  const feedback = document.getElementById('quizFeedback');

  if(accepted.includes(userVal)){
    results[c.id] = 'correct';
    saveProgress();
    input.disabled = true;
    input.className = 'correct';
    feedback.textContent = '정답이에요! ' + c.jp + (c.reading? ' (' + c.reading + ')':'');
    feedback.className = 'quiz-feedback correct';
    document.getElementById('quizNextBtn').classList.add('show');
    document.getElementById('quizHintBtn').style.display='none';
    updateProgress();
  } else {
    quizAttempts++;
    quizMistakeIds.add(c.id);
    results[c.id] = 'wrong';
    saveProgress();
    input.className = 'wrong';
    feedback.className = 'quiz-feedback wrong';
    if(quizAttempts>=4){
      feedback.textContent = '정답은 "' + c.jp + (c.reading? ' (' + c.reading + ')':'') + '" 이에요. 위 칸에 그대로 입력하고 확인을 눌러보세요.';
    } else if(quizAttempts>=2){
      const hintChar = (c.reading||c.jp||'')[0] || '';
      feedback.textContent = '다시 시도해보세요 (힌트: "' + hintChar + '"로 시작해요)';
    } else {
      feedback.textContent = '다시 시도해보세요';
    }
    updateProgress();
    setTimeout(()=>{ input.className=''; }, 350);
  }
}

function nextQuiz(){ quizIdx++; renderQuiz(); }

function setMode(newMode){
  mode = newMode;
  document.getElementById('modeFlip').classList.toggle('active', mode==='flip');
  document.getElementById('modeQuiz').classList.toggle('active', mode==='quiz');
  idx = 0;
  document.getElementById('completeScreen').style.display='none';
  if(mode==='flip'){
    document.getElementById('flipStage').style.display='block';
    document.getElementById('quizStage').style.display='none';
    renderCard();
  } else {
    document.getElementById('flipStage').style.display='none';
    document.getElementById('quizStage').style.display='block';
    buildQuizPool();
    renderQuiz();
  }
  updateProgress();
}

function restartAll(){
  idx=0; quizIdx=0;
  document.getElementById('completeScreen').style.display='none';
  if(mode==='flip'){ document.getElementById('flipStage').style.display='block'; renderCard(); }
  else { buildQuizPool(); document.getElementById('quizStage').style.display='block'; renderQuiz(); }
  updateProgress();
}

function retryWrong(){
  let wrongCards;
  if(mode==='quiz'){
    wrongCards = DECK.filter(c=>quizMistakeIds.has(c.id));
  } else {
    const ids = new Set(deck.map(c=>String(c.id)));
    const wrongIds = Object.keys(results).filter(id=>ids.has(id) && results[id]==='wrong');
    wrongCards = DECK.filter(c=>wrongIds.includes(String(c.id)));
  }
  if(wrongCards.length===0) return;
  deck = wrongCards;
  idx=0;
  document.getElementById('completeScreen').style.display='none';
  if(mode==='flip'){ document.getElementById('flipStage').style.display='block'; renderCard(); }
  else {
    quizPool=[...wrongCards]; quizIdx=0; quizMistakeIds=new Set();
    document.getElementById('quizStage').style.display='block';
    renderQuiz();
  }
  updateProgress();
}

function speak(text){
  if(!text) return;
  if(!('speechSynthesis' in window)){
    alert('이 기기에서는 음성 재생을 지원하지 않아요.');
    return;
  }
  try{
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.8;
    speechSynthesis.speak(utter);
  } catch(e){ /* ignore */ }
}

document.getElementById('card').addEventListener('click', flipCard);
document.getElementById('btnKnow').addEventListener('click', (e)=>{ e.stopPropagation(); markAndAdvance(true); });
document.getElementById('btnDontKnow').addEventListener('click', (e)=>{ e.stopPropagation(); markAndAdvance(false); });
document.getElementById('btnPrev').addEventListener('click', goPrev);
document.getElementById('btnNext').addEventListener('click', goNext);
document.getElementById('btnShuffle').addEventListener('click', shuffleDeck);
document.getElementById('modeFlip').addEventListener('click', ()=>setMode('flip'));
document.getElementById('modeQuiz').addEventListener('click', ()=>setMode('quiz'));
document.getElementById('quizSubmitBtn').addEventListener('click', submitQuizAnswer);
document.getElementById('quizInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submitQuizAnswer(); } });
document.getElementById('quizNextBtn').addEventListener('click', nextQuiz);
document.getElementById('quizHintBtn').addEventListener('click', ()=>{
  const c = quizPool[quizIdx];
  if(!c) return;
  const btn = document.getElementById('quizHintBtn');
  const stage = parseInt(btn.dataset.stage||'0');
  const feedback = document.getElementById('quizFeedback');
  if(stage===0){
    const hintChar = (c.reading||c.jp||'')[0] || '';
    feedback.textContent = '힌트: "' + hintChar + '"로 시작해요';
    feedback.className = 'quiz-feedback hint';
    btn.dataset.stage='1';
    btn.textContent='정답 보기';
  } else {
    feedback.textContent = '정답: ' + c.jp + (c.reading? ' (' + c.reading + ')':'');
    feedback.className = 'quiz-feedback hint';
    btn.dataset.stage='2';
  }
});
document.getElementById('btnRestartAll').addEventListener('click', restartAll);
document.getElementById('btnRetryWrong').addEventListener('click', retryWrong);
document.getElementById('btnResetProgress').addEventListener('click', resetAllProgress);
document.getElementById('speakFrontBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(deck[idx]) speak(deck[idx].jp); });
document.getElementById('speakBackBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(deck[idx]) speak(deck[idx].jp); });
document.getElementById('speakQuizBtn').addEventListener('click', (e)=>{ e.stopPropagation(); if(quizPool[quizIdx]) speak(quizPool[quizIdx].jp); });

document.addEventListener('keydown', (e)=>{
  if(mode!=='flip') return;
  if(e.target && (e.target.tagName==='INPUT')) return;
  if(e.code==='Space'){ e.preventDefault(); flipCard(); }
  if(e.code==='ArrowRight') markAndAdvance(true);
  if(e.code==='ArrowLeft') markAndAdvance(false);
});

renderChips();
buildDeck();
</script>
</body>
